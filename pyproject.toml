[project]
name = "glovebox"
version = "0.1.0"
description = "Computer-use automation that turns one LLM-driven discovery run into a deterministic, replayable, reviewable capability for legacy back-office applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sai Vineeth", email = "saivineeth147@gmail.com" }]
dependencies = [
  "anthropic>=1.5.0",
  "playwright==1.56.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.7",
]

[project.scripts]
glovebox = "glovebox.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glovebox", "apps/legacy_bank"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "PL", "PTH", "S"]
ignore = ["PLR0913", "PLR2004", "S101", "S104", "S311", "RUF012", "PLR0912", "PLR0915", "PLR0911", "S108",
  "PLC0415", "N818", "PLR0917", "E501", "PLW2901"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "B011", "E741"]
"scripts/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["glovebox"]

[[tool.mypy.overrides]]
module = ["playwright.*", "uvicorn.*", "legacy_bank", "legacy_bank.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=120"
markers = ["integration: launches a browser and the target app"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["glovebox"]
