<html>
<head>
<title>{{ t.name }}</title>
<style>
body { font-family: Verdana, Arial; font-size: 11px; background: #f4f4f0; margin: 8px; }
table.frm td { padding: 3px 6px; }
.hdr { color: white; background: {{ t.color }}; font-weight: bold; padding: 4px; }
.err { color: #b00000; font-weight: bold; }
.notice { position: absolute; top: 60px; left: 120px; width: 380px; background: #fffbe6; border: 2px solid #c9a400; padding: 12px; }
.overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.35); }
</style>
</head>
<body>
<table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td class="hdr">{{ t.name }} &nbsp; <font size="1">v{{ t.version }}</font></td></tr></table>
{% block body %}{% endblock %}
<br><font size="1" color="#888">Meridian Core (simulated). All data fictional.</font>
</body>
</html>
