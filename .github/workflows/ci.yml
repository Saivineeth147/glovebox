name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Validate committed artifacts
        run: for f in capabilities/*.json; do uv run glovebox validate "$f"; done
      - name: Tests (unit + browser integration against the simulated app)
        run: uv run pytest -q --timeout=300
      - name: Frontend
        run: |
          cd ui
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx vitest run

      - name: Resilience under simulated redesigns
        # Replays every approved capability against each structural mutation of the target and
        # fails if any of them stops surviving. This is the regression test for the locator
        # ladder: a change that quietly narrows it shows up here rather than in production.
        run: |
          uv run glovebox target serve --port 8089 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8089/__sim/health >/dev/null && break
            sleep 1
          done
          uv run glovebox drift --param member_id=100234

      - name: Upload run evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-runs
          path: /tmp/pytest-of-runner/**/runs*/**
          if-no-files-found: ignore

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: cd ui && npm ci --no-audit --no-fund
      - run: cd ui && npx tsc --noEmit
      - run: cd ui && npx vite build
      - name: Built assets are up to date
        run: git diff --stat --exit-code -- src/glovebox/studio/static || (echo "run 'make ui' and commit the built assets" && exit 1)
